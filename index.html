<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
    <title>Odin Library</title>
</head>
<body>
    <div class="library">
        <h1>Library</h1>
        <table>
            <thead>
                <th>Title</th>
                <th>Author</th>
                <th>Pages</th>
                <th>Read Status</th>
                <th>Actions</th>
            </thead>
            <tbody></tbody>
        </table>
        <button class="new-book-button">New Book</button>
    </div>
    <dialog>
        <div class="new-book-modal">
            <h1>New Book</h1>
            <form>
                <div class="title-field">
                    <label for="title">Title</label>
                    <input type="text" id="title" name="title">
                </div>
                <div class="author-field">
                    <label for="author">Author</label>
                    <input type="text" id="author" name="author">
                </div>
                <div class="pages-field">
                    <label for="pages">Pages</label>
                    <input type="number" id="pages" name="pages">
                </div>
                <div class="read-field">
                    <input type="checkbox" id="read" name="read">
                    <label for="read">I have read this book</label>
                </div>
                <div class="buttons-container">
                    <button type="submit" class="submit-button">Add New Book</button>
                    <button type="button" class="cancel-button">Cancel</button>
                </div>
            </form>
        </div>
    </dialog>
</body>
</html>
